name: 'shoplite-k6'
services:
  db:
    image: postgres:16
    container_name: shoplite-db
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements   # query statistics for performance labs
      - -c
      - max_connections=200
    ports:
      - "5463:5432"
    volumes:
      - shoplite-k6_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build:
      context: ../app/src/ShopLite.Api
    container_name: shoplite-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=db;Port=5432;Database=shop;Username=shop;Password=shop"
      Jwt__Key: "${JWT_KEY:-docker-dev-signing-key-change-me-0123456789}"
      Chaos__Enabled: "true"
      Seed__ProductCount: "${SEED_PRODUCT_COUNT:-10000}"
    ports:
      - "9063:8080"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
volumes:
  shoplite-k6_pgdata:
